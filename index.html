<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema Markup Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="top-title">
      <h1>Schema Markup Tracker</h1>
      <p class="lede">Every URL we maintain structured data for, with what changed and when.
        Click a URL to jump to the code comparison below.</p>
    </div>
    <div id="conn" class="conn noprint" data-state="idle">
      <span class="conn-dot" aria-hidden="true"></span>
      <div class="conn-text">
        <b id="conn-title">Not connected</b>
        <div class="conn-sub" id="conn-sub">Using sample data</div>
      </div>
      <div class="conn-controls" id="conn-controls"></div>
    </div>
  </header>

  <div id="banner" class="noprint"></div>

  <div id="hero" class="noprint"></div>

  <div id="recent" class="noprint"></div>

  <div class="topbar noprint">
    <div class="grow">
      <label for="q" class="sr-only">Search</label>
      <div class="search">
        <svg class="search-i" viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3a6 6 0 104.2 10.2l3.3 3.3 1.4-1.4-3.3-3.3A6 6 0 009 3zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
        <input type="search" id="q" placeholder="Search by URL, title or path…" autocomplete="off">
      </div>
    </div>
    <div>
      <label for="sort">Sort</label>
      <select id="sort" style="width:auto">
        <option value="newest">Newest updated first</option>
        <option value="oldest">Oldest updated first</option>
        <option value="url">URL A–Z</option>
      </select>
    </div>
    <div><button id="expand" type="button">Expand all</button></div>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <div id="tools" class="noprint"></div>

  <footer>
    <span id="site"></span> · <span id="stamp"></span> ·
    <a href="tools/compare.html">Ad-hoc comparison tool</a>
  </footer>

</div>

<button id="totop" class="totop noprint" type="button" hidden
        aria-label="Back to top of the dashboard" title="Back to top">
  <span class="totop-a" aria-hidden="true"></span>Top
</button>

<script src="assets/diff.js"></script>
<script src="data/schema-history.js"></script>
<script src="data/sheet-config.js"></script>
<script src="assets/app.js"></script>
<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="assets/sheet-loader.js" defer></script>
</body>
</html>
